name: virival-ci

on:
  push:
    paths:
      - "virival/**"
      - ".github/workflows/virival-ci.yml"
  pull_request:
    paths:
      - "virival/**"
      - ".github/workflows/virival-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virival
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "virival -> target"

      - name: Formatting check
        run: cargo fmt -- --check

      - name: Compile check
        run: cargo check

      - name: Run tests
        run: cargo test
