services:
  postgres:
    image: postgres:17
    container_name: virivu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virivu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: virivu-api
    environment:
      APP_NAME: virivu-api
      BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/virivu
      GOOGLE_WORKSPACE_DOMAIN: example.org
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
